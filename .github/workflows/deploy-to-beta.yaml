name: Deploy to Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  # Workflow alone — see the note in deploy-to-dev.yaml. One server tree per
  # workflow, so runs from different refs must queue rather than race.
  group: ${{ github.workflow }}
  cancel-in-progress: false # Don't cancel an in-flight deploy

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: beta
      base_path: /srv/beta-claytontv
      gunicorn_service: gunicorn-claytontv-beta.service
      url: https://beta.claytontv.co.uk/
      reindex: true
    secrets: inherit
