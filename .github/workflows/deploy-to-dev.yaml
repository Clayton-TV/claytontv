name: Deploy to Dev

on:
  # Auto-deploying on push keeps the environment in step with the branch and
  # surfaces migration/deploy breakage early. Note this runs alongside CI rather
  # than after it, so a red build still deploys — dev is where we want to find
  # that out. Manual dispatch remains for redeploys.
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  # Keyed on the workflow alone, deliberately: this workflow always deploys to
  # the same server tree, so a push-triggered run and a dispatch from another
  # branch must queue behind each other. Including github.ref would put them in
  # separate groups and let them race on migrate, reindex and the symlink swap.
  group: ${{ github.workflow }}
  cancel-in-progress: false # Don't cancel an in-flight deploy

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: dev
      base_path: /srv/dev-claytontv
      gunicorn_service: gunicorn-claytontv-dev.service
      url: https://dev.claytontv.co.uk/
      reindex: true
    secrets: inherit
