name: Deploy to Dev

on:
  # Dev only moves via CI-green PRs (branch protection, #347), so auto-deploying
  # on push keeps the environment in step with the branch and surfaces
  # migration/deploy breakage early. Manual dispatch remains for redeploys.
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel an in-flight deploy

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: dev
      base_path: /srv/dev-claytontv
      gunicorn_service: gunicorn-claytontv-dev.service
      url: https://dev.claytontv.co.uk/
      reindex: true
    secrets: inherit
