name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  push:
    branches:
      - dev
      - beta
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks scans the checked-out files below; it does not scan Git history.
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-suffix: py3.14
          cache-python: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore gitleaks
        id: gitleaks-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gitleaks-8.30.1
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-8.30.1

      - name: Install gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        run: |
          curl --fail --location --silent --show-error "$GITLEAKS_URL" --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-8.30.1"
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP/gitleaks-8.30.1" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks-8.30.1/gitleaks"

      - name: Gitleaks check
        run: |
          "$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" dir "$GITHUB_WORKSPACE"

      - name: Lint code
        run: uv run poe lint-check

      - name: Format code
        run: uv run poe format-check

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint code
        run: npm run lint-check

      - name: Check formatting
        run: npm run format-check

      - name: Unit tests (Vitest)
        run: npm run test:unit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-suffix: py3.14
          cache-python: true
          save-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run poe test
