[project]
name = "claytontv"
version = "0.1.0"
description = "Clayton TV provides Christian media you can trust."
authors = [{ name = "Jamie Gardner", email = "jamie@tgo.dev" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.7,<7.0",
    "python-dotenv>=1.1",
    "psycopg[binary]>=3.3",
    "redis>=5.2",
    "gunicorn>=23.0",
    "poethepoet>=0.34",
    "whitenoise>=6.9",
    "dj-database-url>=2.3",
    "inertia-django>=1.2",
    "django-vite>=3.1",
    "sentry-sdk>=2.62.0",
    "beautifulsoup4>=4.15.0",
    "typesense>=2.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2",
    "ruff>=0.11",
    "pytest>=8.3",
    "pytest-django>=4.11",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
]

[tool.uv]
constraint-dependencies = ["sqlparse>=0.6.0"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.test_settings"

[tool.coverage.run]
source = ["app", "catalogue", "livestreams"]
omit = [
    "*/migrations/*",
    "app/wsgi.py",
    "app/asgi.py",
    "app/*settings*.py",
    "*/management/commands/*",
]

[tool.coverage.report]
show_missing = true

[tool.poe.tasks]
run = "python manage.py runserver --settings app.local_settings"
format-check = "ruff format --check ."
lint-check = "ruff check ."

[tool.poe.tasks.prod]
help = "Run a production-like server"
sequence = [
    "npm install",
    "npm run build-only",
    "poe manage collectstatic --noinput",
    "poe manage migrate",
    "gunicorn app.wsgi",
]
default_item_type = "cmd"

[tool.poe.tasks.dev]
help = "Run the development server and Vite concurrently"
cmd = "npx concurrently -c \"#93c5fd,#fdba74\" \"poe run\" \"npm run dev\" --names=server,vite"

[tool.poe.tasks.manage]
help = "Run Django management commands"
cmd = "python manage.py ${args}"

[tool.poe.tasks.format]
help = "Format all Python files according to the project style"
cmd = "ruff format ."

[tool.poe.tasks.lint]
help = "Lint all Python files and fix any fixable issues"
cmd = "ruff check --fix ."

[tool.poe.tasks.fix]
help = "Lint and format all Python files"
sequence = ["lint", "format"]

[tool.poe.tasks.test]
help = "Run the test suite (with the coverage gate, matching CI)"
cmd = "pytest --cov --cov-report=term-missing --cov-fail-under=80"

[tool.poe.tasks.typesense]
help = "Run a local Typesense container for search development"
cmd = "docker compose up typesense"

[tool.poe.tasks.generate-key]
help = "Generate a Django secret key and write it to the .env file if SECRET_KEY is empty"
cmd = "python manage.py generate_key"
