# Local Typesense for search development only. The dev and beta servers run
# their own persistent containers provisioned under the environment's
# shared/typesense/ (production is not provisioned yet — see docs/DEPLOYMENT.md);
# this file is not used there. Bound to loopback, never exposed off-machine.
#
#   docker compose up typesense      # or: uv run poe typesense
#   uv run poe manage reindex_search
#
# Set TYPESENSE_API_KEY in your .env to the same value (default: dev-typesense-key).
services:
  typesense:
    image: typesense/typesense:28.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense-data:/data
    command: "--data-dir /data --api-key=${TYPESENSE_API_KEY:-dev-typesense-key} --enable-cors"

volumes:
  typesense-data:
